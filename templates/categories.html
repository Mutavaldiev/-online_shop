
{% extends 'base.html' %}

{% block content %}

<div class="container">
    <h2>Categories</h2>

    <div class="categories">
        {% for category in categories %}
            <div class="category-card">
                <h3>{{ category.name }}</h3>
                <p>{{ category.description }}</p>

                <a href="{% url 'products' %}?category={{ category.id }}">
                    View Products
                </a>
            </div>
        {% empty %}
            <p>No categories available.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
